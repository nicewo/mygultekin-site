# Deploys the site to Firebase Hosting (live channel) on every push to main.
# Secret FIREBASE_SERVICE_ACCOUNT_MYGULTEKIN_1CE3F was created by `firebase init hosting:github`.

name: Deploy to Firebase Hosting on push
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true
jobs:
  deploy_live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYGULTEKIN_1CE3F }}
          channelId: live
          projectId: mygultekin-1ce3f
